# BGE-M3 baseline configuration for Q1 paper experiments
paths:
  raw_data_dir: data/raw
  processed_data_dir: data/processed
  eval_data_dir: data/eval
  index_dir: data/indexes
  results_dir: results
  corpus_file: corpus.jsonl
  eval_file: manual_eval_v5.jsonl

retrieval:
  backend: embedding
  model_name: BAAI/bge-m3
  top_k: 10

generation:
  backend: stub

experiment:
  retrieval_mode: vector
  prompt_style: grounded
  seed: 42
