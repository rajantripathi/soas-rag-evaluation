base_config: base.yaml

paths:
  raw_data_dir: data/raw
  processed_data_dir: data/processed
  eval_data_dir: data/eval
  index_dir: data/indexes
  results_dir: results
  logs_dir: results/logs
  corpus_file: corpus_full_supp_clean.jsonl
  eval_file: manual_eval_v5.jsonl
  index_name: q1_full_supp_clean_e5

dataset:
  smoke_max_docs: 500
  smoke_max_eval: 400
  generate_eval: false

retrieval:
  backend: embedding
  model_name: intfloat/multilingual-e5-large
  top_k: 10

generation:
  backend: stub

experiment:
  retrieval_mode: vector
  prompt_style: grounded
  seed: 42
