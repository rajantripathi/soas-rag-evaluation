base_config: base.yaml

paths:
  corpus_file: corpus_uzbek_only.jsonl
  eval_file: manual_eval_v5.jsonl
  index_name: cross_lingual_uzbek_only_index

dataset:
  smoke_max_docs: 500
  smoke_max_eval: 500
  generate_eval: false

retrieval:
  backend: embedding
  model_name: intfloat/multilingual-e5-large

experiment:
  retrieval_mode: vector
  prompt_style: grounded
  cross_lingual: "en_on_uz"  # English questions on Uzbek corpus
