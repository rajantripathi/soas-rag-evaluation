name: Public artifact checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  public-artifact:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check evaluator and public release
        run: python -m unittest discover -s tests -v
      - name: Independently verify published pilot metrics
        run: python scripts/verify_pilot_artifacts.py
      - name: Verify frozen title-masking metrics and baseline ranks
        run: python scripts/verify_title_masking.py
      - name: Check oracle wiring (not model performance)
        run: python scripts/compute_retrieval_recall.py --oracle-check --k 3

  pilot-fixture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numerical fixture dependency
        run: python -m pip install numpy==2.4.6
      - name: Check synthetic pilot and public release
        run: python -m unittest discover -s tests -v
