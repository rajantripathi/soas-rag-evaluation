name: Public artifact checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  public-artifact:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check evaluator and public release
        run: python -m unittest discover -s tests -v
      - name: Check oracle wiring (not model performance)
        run: python scripts/compute_retrieval_recall.py --oracle-check --k 3
