<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="420" viewBox="0 0 1100 420">
  <rect width="100%" height="100%" fill="#f7f4ed"/>
  <text x="550" y="42" text-anchor="middle" font-family="Georgia, serif" font-size="28" fill="#1f2937">Culturally Grounded Retrieval Benchmark Pipeline</text>

  <rect x="40" y="110" width="180" height="90" rx="12" fill="#d97706"/>
  <text x="130" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#ffffff">Dataset Staging</text>
  <text x="130" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#ffffff">MIRACL</text>
  <text x="130" y="188" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#ffffff">TyDi QA</text>

  <rect x="250" y="110" width="180" height="90" rx="12" fill="#4d7c0f"/>
  <text x="340" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#ffffff">Corpus Build</text>
  <text x="340" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#ffffff">normalize</text>
  <text x="340" y="188" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#ffffff">supplement</text>

  <rect x="460" y="110" width="180" height="90" rx="12" fill="#0f766e"/>
  <text x="550" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#ffffff">Indexing</text>
  <text x="550" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#ffffff">vector</text>
  <text x="550" y="188" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#ffffff">BM25 / hybrid</text>

  <rect x="670" y="110" width="180" height="90" rx="12" fill="#1d4ed8"/>
  <text x="760" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#ffffff">Evaluation</text>
  <text x="760" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#ffffff">manual_eval_v2</text>
  <text x="760" y="188" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#ffffff">manual_eval_v4</text>

  <rect x="880" y="110" width="180" height="90" rx="12" fill="#7c3aed"/>
  <text x="970" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#ffffff">Research Outputs</text>
  <text x="970" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#ffffff">tables</text>
  <text x="970" y="188" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#ffffff">figures / notes</text>

  <line x1="220" y1="155" x2="250" y2="155" stroke="#374151" stroke-width="4"/>
  <polygon points="250,155 238,148 238,162" fill="#374151"/>
  <line x1="430" y1="155" x2="460" y2="155" stroke="#374151" stroke-width="4"/>
  <polygon points="460,155 448,148 448,162" fill="#374151"/>
  <line x1="640" y1="155" x2="670" y2="155" stroke="#374151" stroke-width="4"/>
  <polygon points="670,155 658,148 658,162" fill="#374151"/>
  <line x1="850" y1="155" x2="880" y2="155" stroke="#374151" stroke-width="4"/>
  <polygon points="880,155 868,148 868,162" fill="#374151"/>

  <rect x="170" y="270" width="760" height="90" rx="16" fill="#fffdf7" stroke="#d6d3d1" stroke-width="2"/>
  <text x="550" y="304" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#111827">Main Empirical Finding</text>
  <text x="550" y="334" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#374151">Culturally grounded retrieval quality depended primarily on knowledge source coverage</text>
  <text x="550" y="356" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#6b7280">larger gains came from corpus supplementation than from chunking, embedding swaps, or hybrid retrieval</text>
</svg>
